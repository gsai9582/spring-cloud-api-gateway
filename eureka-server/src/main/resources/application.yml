server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

# Ensure this app is ONLY the server; do not enable discovery client behaviors.
instance:
  prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

